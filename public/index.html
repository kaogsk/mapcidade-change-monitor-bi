<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font:1rem system-ui;color:#182c39;background:#eef4f5;margin:0}main{max-width:1050px;margin:2rem auto;padding:1rem}
h1{margin-top:0}form,section{background:#fff;border:1px solid #ccdbde;border-radius:12px;padding:1rem;margin:.8rem 0}
label{display:inline-grid;gap:.25rem;margin:.25rem .7rem .25rem 0}button,input,select{font:inherit;padding:.45rem}
button{background:#125f64;color:#fff;border:0;border-radius:5px;cursor:pointer}dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.7rem}
dl div{border-left:3px solid #178488;padding:.4rem .6rem}dt{font-size:.85rem}dd{margin:0;font-weight:650}
table{border-collapse:collapse;width:100%}td,th{padding:.35rem;text-align:left;border-bottom:1px solid #e3ebed}
[role=status]{min-height:1.4rem} [hidden]{display:none}
</style>
<title>MapCidade Change Monitor</title>
</head><body><main>
<h1>MapCidade Change Monitor</h1>
<p>Follow detected changes, municipal reviews and project delivery.</p>
<form id="filters">
<label>View <select name="view">
<option value="monitor">Alerts</option><option value="response">Response</option>
<option value="edits">Edit activity</option><option value="history">Daily snapshots</option>
<option value="loads">ETL status</option><option value="register/contracts">Contract register</option>
</select></label>
<label>Municipality <select name="municipality"><option value="">All</option></select></label>
<button>Apply</button>
</form>
<p role="status" aria-live="polite"></p>
<div id="report"></div>
</main><script type="module">
function summary(title, data) {
  const section = document.createElement("section");
  const heading = document.createElement("h2");
  heading.textContent = title;
  section.append(heading);
  if (!data || !Object.keys(data).length) return section;
  const list = document.createElement("dl");
  for (const [name, value] of Object.entries(data)) {
    const item = document.createElement("div");
    const label = document.createElement("dt");
    const metric = document.createElement("dd");
    label.textContent = name.replace(/([A-Z])/g, " $1").replaceAll("_", " ");
    metric.textContent = typeof value === "number" ? new Intl.NumberFormat("en", { maximumFractionDigits: 2 }).format(value) : value ?? "—";
    item.append(label, metric);
    list.append(item);
  }
  section.append(list);
  return section;
}
function table(title, rows) {
  const section = summary(title);
  if (!rows.length) {
    section.append("No matching records.");
    return section;
  }
  const grid = document.createElement("table");
  const keys = Object.keys(rows[0]);
  function addRow(parent, values, tag) {
    const row = parent.insertRow();
    for (const value of values) {
      const cell = document.createElement(tag);
      cell.textContent = value ?? "—";
      row.append(cell);
    }
  }
  addRow(grid.createTHead(), keys, "th");
  const body = grid.createTBody();
  for (const row of rows) addRow(body, keys.map((key) => row[key]), "td");
  section.append(grid);
  return section;
}
const form = document.querySelector("#filters");
const status = document.querySelector("[role=status]");
const report = document.querySelector("#report");

async function request(path) {
  const response = await fetch("/api/" + path);
  if (response.status === 401) location.assign("/login.html");
  if (!response.ok) throw new Error("Could not load the report.");
  return response.json();
}
async function load(event) {
  event?.preventDefault();
  status.textContent = "Loading…";
  try {
    const { view, municipality } = Object.fromEntries(new FormData(form));
    const result = await request(view + (municipality ? "?" + new URLSearchParams({ municipality }) : ""));
    report.replaceChildren();
    for (const [name, data] of Object.entries(result)) {
      if (Array.isArray(data) && data[0] && typeof data[0] === "object") {
        const rows = data.map((row) => Object.fromEntries(Object.entries(row).filter(([, value]) => value === null || typeof value !== "object")));
        if (Object.keys(rows[0]).length) report.append(table(name, rows.slice(0, 30)));
      } else if (data && typeof data === "object" && !Array.isArray(data)) {
        const entries = Object.entries(data).filter(([, value]) => value === null || typeof value !== "object");
        if (entries.length) report.append(summary(name, Object.fromEntries(entries)));
      }
    }
    status.textContent = report.childElementCount ? "" : "No records to display.";
  } catch (error) {
    report.replaceChildren();
    status.textContent = error.message;
  }
}
form.addEventListener("submit", load);
try {
  const meta = await request("meta");
  for (const municipality of meta.municipalities) {
    form.elements.municipality.add(new Option(municipality, municipality));
  }
  await load();
} catch (error) { status.textContent = error.message; }
</script></body></html>
