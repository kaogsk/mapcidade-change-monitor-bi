<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font:1rem system-ui;color:#182c39;background:#eef4f5;margin:0}main{max-width:1050px;margin:2rem auto;padding:1rem}
h1{margin-top:0}form,section{background:#fff;border:1px solid #ccdbde;border-radius:12px;padding:1rem;margin:.8rem 0}
label{display:inline-grid;gap:.25rem;margin:.25rem .7rem .25rem 0}button,input,select{font:inherit;padding:.45rem}
button{background:#125f64;color:#fff;border:0;border-radius:5px;cursor:pointer}dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.7rem}
dl div{border-left:3px solid #178488;padding:.4rem .6rem}dt{font-size:.85rem}dd{margin:0;font-weight:650}
table{border-collapse:collapse;width:100%}td,th{padding:.35rem;text-align:left;border-bottom:1px solid #e3ebed}
[role=status]{min-height:1.4rem} [hidden]{display:none}
</style>
<title>Sign in · MapCidade Change Monitor</title>
</head><body><main>
<h1>MapCidade Change Monitor</h1>
<p>Sign in to see the fictional monitoring portfolio. The demo password is <code>demo-password</code>.</p>
<form id="login">
<label>Username <input name="username" autocomplete="username" value="demo" required></label>
<label>Password <input name="password" type="password" autocomplete="current-password" required></label>
<button>Sign in</button>
</form>
<p role="status" aria-live="polite"></p>
</main><script type="module">
const login = document.querySelector("#login");
const status = document.querySelector("[role=status]");
async function signIn(event) {
  event.preventDefault();
  try {
    const response = await fetch("/auth/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.fromEntries(new FormData(login))),
    });
    if (!response.ok) throw new Error((await response.json()).error);
    login.reset();
    await signedIn();
  } catch (error) { status.textContent = error.message; }
}
login.addEventListener("submit", signIn);
function signedIn() { location.assign("/"); }
</script></body></html>
